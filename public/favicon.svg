<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle / Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Rim Glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#6ee7b7" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Main Symbol Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Freshness Leaf (Left & Center arching up) -->
    <path d="M 256 120 C 190 120 150 170 160 250 C 195 245 235 220 256 185 C 277 220 317 245 352 250 C 362 170 322 120 256 120 Z" fill="url(#leafGrad)"/>
    
    <!-- Leaf Center Stem Vein -->
    <path d="M 256 140 L 256 240" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Heart Motif (Care & Community) -->
    <path d="M 256 220 C 248 205 230 195 215 205 C 195 218 198 245 225 270 L 256 300 L 287 270 C 314 245 317 218 297 205 C 282 195 264 205 256 220 Z" fill="url(#heartGrad)"/>

    <!-- Food Sharing Bowl / Plate Base -->
    <path d="M 128 290 Q 256 280 384 290 C 375 365 320 400 256 400 C 192 400 137 365 128 290 Z" fill="url(#bowlGrad)"/>
    
    <!-- Bowl Rim / Helping Hands Curve -->
    <path d="M 116 288 Q 256 276 396 288" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Warm Meal Steam / Ripple Lines -->
    <path d="M 210 260 Q 220 250 215 240" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 302 260 Q 292 250 297 240" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>